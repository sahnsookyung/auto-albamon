# JobScout public defaults. These values contain no credentials or private data.
#
# Personal overrides belong in config/jobscout.local.toml (gitignored). To use a
# different override file, set JOBSCOUT_CONFIG=/absolute/path/to/settings.toml.
# Unknown options, invalid enum values, and secret-like keys fail at startup.
# API keys and Discord webhooks belong only in .env; see .env.example.

[albamon]
# Albamon saved-search number. Set this in jobscout.local.toml; zero makes a
# network refresh fail with a setup error instead of using somebody else's ID.
saved_search_id = 0
# Fail-closed public sentinel. Set a real inclusive deadline in the local file.
availability_end_date = 1970-01-01
# Result page size (1–10,000) and parallel detail workers (1–32).
page_size = 5000
workers = 24

# Options: suit, multi_slot, evening, station_safety, remote, summer, urgent.
# Remove an item to stop collecting that lane. `evening.enabled = false` also
# disables the evening lane even when it remains in this list.
enabled_sources = [
  "suit",
  "multi_slot",
  "evening",
  "station_safety",
  "remote",
  "summer",
  "urgent",
]

# Options: one_day, under_one_week, one_week_to_one_month.
# These are Albamon source buckets; detail text can still reject a contradiction.
work_periods = ["one_day", "under_one_week", "one_week_to_one_month"]

# Any Seoul district name may be listed. Remove districts to narrow collection.
target_districts = [
  "강남구", "강동구", "강북구", "강서구", "관악구", "광진구", "구로구",
  "금천구", "노원구", "도봉구", "동대문구", "동작구", "마포구", "서대문구",
  "서초구", "성동구", "성북구", "송파구", "양천구", "영등포구", "용산구",
  "은평구", "종로구", "중구", "중랑구",
]
remote_minimum_hourly_won = 10320

# Applicant eligibility inputs. Zero/"unrestricted" are privacy-safe defaults;
# a posting with a conflicting age/gender restriction then fails closed.
requested_age = 0
requested_gender = "unrestricted"

[albamon.evening]
# Cross-midnight windows are supported, for example 19:00 through 02:00.
enabled = true
available_from = "19:00"
available_until = "02:00"
districts = ["강남구", "서초구", "송파구"]
# Walking estimate = straight-line distance × route factor ÷ walking speed.
station_walk_limit_minutes = 20
walk_speed_kmh = 4.8
walk_route_factor = 1.2

# Each station needs its Albamon selector IDs and WGS84 coordinates. Duplicate
# names or unsupported/malformed coordinate records fail at startup. Copy an
# existing row when adding a station, then replace every value from Albamon's
# public station selector and a verified map coordinate.
[[albamon.evening.stations]]
name = "역삼역"
area_code = "1"
line_code = "102"
station_code = "10214"
latitude = 37.5007176207
longitude = 127.0366187692

